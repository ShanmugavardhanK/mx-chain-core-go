coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 100%
        threshold: 0%

ignore:
  - "**/*.pb.go"
  - "**/mock/*.go"
  - "**/*_mock.go"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: "uncovered_patch"
  show_uncovered_lines: true